:root{--paper:#f6f6f4;--ink:#111113;--mute:#6f6f76;--line:#e5e5e0;--purple:#8b5cf6;--green:#16a36a;--red:#e5484d;--amber:#f5a524;
 --sh:0 1px 2px rgba(20,20,30,.05),0 14px 36px rgba(20,20,30,.08),0 46px 100px rgba(20,20,30,.10)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0b0d;overflow:hidden;font-family:'Outfit',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#frame{position:relative;overflow:hidden;border-radius:12px;background:#000;box-shadow:0 30px 80px rgba(0,0,0,.5)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--paper)}
body.render #wrap{display:block}
body.render #frame{position:fixed;left:0;top:0;width:1920px;height:1080px;border-radius:0;box-shadow:none}
body.render #ctrl,body.render #cover{display:none!important}
.mono{font-family:'JB',ui-monospace,monospace}
.scene{position:absolute;inset:0;overflow:hidden;background-color:var(--paper);background-image:radial-gradient(circle,#cbcbc4 1.8px,transparent 2px);background-size:36px 36px}
.scene.nodots{background-image:none}
.scene.dark{background-color:#0a0a0b;background-image:radial-gradient(circle,#1d1d21 1.7px,transparent 1.9px);color:#fff}
.h1{font-weight:600;letter-spacing:-.04em;line-height:1.03;text-align:center}
.w,.wi{display:inline-block}
.acc{color:var(--purple)}
.amb{color:var(--amber)}
.rel{position:relative}
.ul{position:absolute;left:-3%;bottom:-.17em;width:106%;height:.26em;overflow:visible;pointer-events:none}
.ul path{fill:none;stroke:var(--purple);stroke-width:7;stroke-linecap:round}
svg.ic{width:1em;height:1em;display:block}
canvas.cv{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;z-index:1}
canvas.cv+div+div+canvas.cv,.win~canvas.cv{z-index:150000}
.cap{z-index:200001}.pill,.lgtm,#cnt{z-index:200002}

/* PR window */
.win{position:absolute;left:0;top:0;width:1040px;margin:-214px 0 0 -520px;background:#fff;border:1.5px solid #e4e4df;border-radius:34px;box-shadow:var(--sh);overflow:hidden;transform-origin:50% 50%}
.win .bar{height:66px;display:flex;align-items:center;padding:0 28px;border-bottom:1.5px solid #ececE8;background:#fafaf8;position:relative}
.win .bar i{width:15px;height:15px;border-radius:50%;background:#dcdcd7;margin-right:11px}
.win .bar span{position:absolute;left:0;right:0;text-align:center;font-size:22px;color:#77777d;font-weight:500}
.win .body{padding:26px 28px 28px}
.file{border:1.5px solid #e8e8e3;border-radius:18px;overflow:hidden;background:#fff}
.file .fn{height:52px;display:flex;align-items:center;padding:0 22px;background:#fafaf8;border-bottom:1.5px solid #ececE8;font-family:'JB',monospace;font-size:21px;color:#6b6b72}
.ln{display:flex;align-items:center;height:56px;font-family:'JB',monospace;font-size:27px;white-space:pre;position:relative}
.ln b{width:84px;text-align:center;font-weight:400;color:#a4a4ab;font-size:22px;flex:none}
.ln.del{background:#fdeceb}.ln.del b,.ln.del span{color:#c8423f}
.ln.add{background:#e6f8ec}.ln.add b,.ln.add span{color:#1b8a52}
.ln span{color:#2b2b30}
.caret{display:inline-block;width:3px;height:30px;background:var(--purple);vertical-align:-6px;margin-left:2px}
.ring{position:absolute;left:84px;right:10px;top:2px;bottom:2px;border:3px solid var(--purple);border-radius:12px;opacity:0}

/* overlays on BC scene */
.cap{position:absolute;font-weight:600;letter-spacing:-.035em;line-height:1.04}
.pill{display:inline-flex;align-items:center;gap:12px;height:62px;padding:0 26px;border-radius:31px;background:#fff;border:1.5px solid var(--line);font-size:26px;font-weight:500;box-shadow:0 8px 24px rgba(20,20,30,.07)}
.pill svg{width:26px;height:26px}
.pill.g{background:#e9f8ef;border-color:#c9ecd7;color:#12804f}
.pill.m{font-family:'JB',monospace;font-size:24px;color:#6b6b72}
.lgtm{position:absolute;left:560px;width:800px;height:96px;border-radius:26px;background:#fff;border:1.5px solid var(--line);box-shadow:var(--sh);display:flex;align-items:center;padding:0 28px;gap:20px}
.av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#d9d9d4,#b9b9b3);flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;font-size:24px}
.lgtm .u{font-weight:600;font-size:27px}.lgtm .s{color:var(--mute);font-size:25px}
.lgtm .ok{margin-left:auto;display:flex;align-items:center;gap:10px;color:#12804f;font-weight:600;font-size:25px}
.lgtm .ok svg{width:28px;height:28px}
.fadeband{position:absolute;left:0;right:0;pointer-events:none}

/* graph nodes */
.node{position:absolute;left:0;top:0;width:400px;height:124px;margin:-62px 0 0 -200px;border-radius:24px;background:#fff;border:2.5px solid #e6e6e1;padding:21px 28px;box-shadow:0 10px 30px rgba(20,20,30,.07);transform-origin:50% 50%}
.node .nf{font-family:'JB',monospace;font-size:20px;color:#9a9aa2;white-space:nowrap}
.node .nn{font-weight:600;font-size:34px;letter-spacing:-.02em;margin-top:8px;white-space:nowrap}
.node .tag{position:absolute;right:22px;top:-22px;height:40px;padding:0 16px;border-radius:20px;background:#fff1f0;border:2px solid #f5c2bf;color:#c8423f;font-weight:600;font-size:21px;display:flex;align-items:center;gap:8px;white-space:nowrap;opacity:0}
.node .tag svg{width:20px;height:20px}
#cnt{position:absolute;left:96px;bottom:84px;display:flex;align-items:center;gap:18px;height:96px;padding:0 38px 0 30px;border-radius:48px;background:#fff;border:1.5px solid var(--line);box-shadow:var(--sh);opacity:0}
#cnt b{font-size:64px;font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--purple);min-width:44px;text-align:center}
#cnt span{font-size:32px;color:var(--ink);font-weight:500}

/* scene D cards */
.card{position:absolute;background:#fff;border:1.5px solid var(--line);border-radius:44px;box-shadow:var(--sh);width:640px;height:330px;padding:44px 56px}
.card .n{font-size:196px;font-weight:700;letter-spacing:-.06em;line-height:.95}
.card .l{font-size:44px;color:var(--mute);font-weight:500;margin-top:6px;letter-spacing:-.02em}
.arrow{position:absolute;width:104px;height:104px;border-radius:50%;background:#fff;border:1.5px solid var(--line);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center}
.arrow svg{width:44px;height:44px}

/* scene E chips */
.chip{position:absolute;left:0;top:0;height:78px;padding:0 30px 0 26px;border-radius:22px;background:#151517;border:1.5px solid #2a2a2f;display:flex;align-items:center;gap:16px;font-size:28px;color:#b8b8c0;white-space:nowrap;font-weight:500}
.chip i{width:14px;height:14px;border-radius:50%;background:var(--amber);flex:none}
.chip.hot{color:#fff;border-color:#4a4a52}.chip.hot i{background:var(--red)}

/* panel */
.panel{position:absolute;left:0;top:0;width:800px;background:#fff;border:1.5px solid var(--line);border-radius:40px;box-shadow:var(--sh);padding:40px 44px 36px}
.panel .ph{display:flex;justify-content:space-between;font-family:'JB',monospace;font-size:21px;letter-spacing:.06em;color:#9a9aa2}
.panel .live{display:flex;align-items:center;gap:10px}.panel .live i{width:11px;height:11px;border-radius:50%;background:var(--green)}
.panel .pt{font-size:38px;font-weight:600;letter-spacing:-.025em;line-height:1.28;margin:26px 0 24px}
.panel code{display:inline-block;font-family:'JB',monospace;font-weight:500;font-size:26px;background:#f1f1ee;border:1.5px solid var(--line);border-radius:12px;padding:2px 12px;letter-spacing:0}
.rows{border:1.5px solid var(--line);border-radius:24px;overflow:hidden;background:#fafaf8}
.row{height:92px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:29px;font-weight:500;border-bottom:1.5px solid var(--line)}
.row:last-child{border-bottom:0}
.row .an{display:flex;align-items:center;gap:18px}
.row .orb{width:20px;height:20px;border-radius:50%;border:3px solid #c9c9d0;position:relative}
.row .st{font-family:'JB',monospace;font-size:23px;letter-spacing:.05em;display:flex;align-items:center;gap:12px;color:#9a9aa2;min-width:250px;justify-content:flex-end}
.row .st svg{width:24px;height:24px}
.pf{display:flex;justify-content:space-between;align-items:center;margin-top:26px;font-size:28px;font-weight:500}
.badge{font-family:'JB',monospace;font-weight:600;font-size:25px;letter-spacing:.06em;padding:14px 28px;border-radius:14px;border:2px solid #cfcfd6;color:#9a9aa2;background:#fff}

/* keys */
.key{position:absolute;top:0;left:0;width:360px;height:380px;border-radius:66px;background:linear-gradient(#fff,#f3f3f0);border:1.5px solid #ebebe6;padding:46px 0 0;text-align:center;display:flex;flex-direction:column;align-items:center}
.key .ki{width:92px;height:92px;color:#a1a1a9}
.key .kt{margin-top:34px;font-size:52px;font-weight:600;letter-spacing:-.035em}
.kbar{position:absolute;bottom:46px;left:50%;margin-left:-46px;width:92px;height:8px;border-radius:4px;background:var(--purple);transform:scaleX(0)}
.kd{position:absolute;width:360px;text-align:center;font-size:29px;line-height:1.3;color:var(--mute)}

/* conversation & commit suggestion */
.win2{position:absolute;left:400px;top:210px;width:1120px;background:#fff;border:1.5px solid #e4e4df;border-radius:34px;box-shadow:var(--sh);overflow:hidden}
.thread{padding:26px 32px 28px;display:flex;flex-direction:column;gap:18px}
.cm{display:flex;gap:18px}
.cm .av2{width:56px;height:56px;border-radius:15px;flex:none;overflow:hidden;background:#000}
.cm .av2 img{width:100%;height:100%}
.cm .bub{flex:1;border:1.5px solid var(--line);border-radius:22px;overflow:hidden}
.cm .hd{height:52px;display:flex;align-items:center;padding:0 22px;gap:12px;border-bottom:1.5px solid #efefea;background:#fcfcfb;font-size:24px}
.cm .hd b{font-weight:600}.cm .hd span{color:var(--mute);font-size:21px}
.cm .tx{padding:16px 24px 18px;font-size:25px;line-height:1.4;color:#3a3a40}
.cm .tx h4{font-size:31px;font-weight:600;letter-spacing:-.025em;color:var(--ink);margin-bottom:8px}
.cm .tx code{font-family:'JB',monospace;font-size:22px;background:#f1f1ee;border:1.5px solid var(--line);border-radius:8px;padding:1px 8px}
.react{display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 16px;border-radius:21px;border:1.5px solid #bfe8cf;background:#e9f8ef;color:#12804f;font-weight:600;font-size:22px}
.react svg{width:20px;height:20px}
.sugg-box{margin-top:12px;border:1.5px solid #d8d8d4;border-radius:16px;overflow:hidden;background:#fff}
.sugg-hd{background:#f9f9f7;height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:18px;font-weight:600;color:#606068;border-bottom:1.5px solid #eaeae6}
.sugg-hd .diff-stat{font-family:'JB',monospace;font-size:16px;color:#1a7f37;background:rgba(46,160,67,.12);padding:2px 8px;border-radius:6px;border:1px solid rgba(46,160,67,.2)}
.sugg-code{font-family:'JB',monospace;font-size:20px;line-height:1.42}
.sugg-ln{display:flex;align-items:center;gap:16px;padding:6px 20px}
.sugg-ln b{width:32px;color:#9c9ca4;font-weight:400;user-select:none;font-size:17px}
.sugg-ln.del{background:rgba(207,34,46,.08);color:#cf222e}
.sugg-ln.del span{color:#82071e}
.sugg-ln.add{background:rgba(26,127,55,.09);color:#1a7f37}
.sugg-ln.add span{color:#116329}
.sugg-ft{padding:10px 20px;background:#f9f9f7;border-top:1.5px solid #eaeae6;display:flex;justify-content:flex-end}
.commit-btn{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 20px;border-radius:10px;background:#1f883d;color:#fff;font-size:18px;font-weight:600;box-shadow:0 2px 8px rgba(31,136,61,.2);cursor:pointer;transform-origin:50% 50%}
.commit-btn svg{width:17px;height:17px}
.commit-btn.done{background:#16a34a;box-shadow:0 3px 12px rgba(22,163,74,.3)}
.h-cur{position:absolute;left:0;top:0;width:44px;height:44px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25));z-index:20;pointer-events:none}
.h-rip{position:absolute;left:0;top:0;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:3px solid #16a34a;pointer-events:none;z-index:19;opacity:0}

/* end */
.cta{position:absolute;height:98px;border-radius:26px;display:flex;align-items:center;justify-content:center;gap:16px;font-size:34px;font-weight:600;letter-spacing:-.015em}
.cta.b{background:#111113;color:#fff;box-shadow:0 18px 40px rgba(17,17,19,.25)}
.cta.o{background:#fff;border:1.5px solid var(--line);box-shadow:0 10px 28px rgba(20,20,30,.08)}
.cta svg{width:34px;height:34px}
#cursor{position:absolute;left:0;top:0;width:54px;height:54px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}

/* controls */
#ctrl{width:min(1100px,92vw);display:flex;align-items:center;gap:14px;color:#c9c9cf;font:500 14px 'JB',monospace}
#ctrl button{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;background:#1c1c20;display:flex;align-items:center;justify-content:center;color:#fff}
#ctrl button:hover{background:#2a2a30}
#ctrl svg{width:18px;height:18px}
#scrub{flex:1;accent-color:#8b5cf6;height:4px}
#cover{position:absolute;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(10,10,12,.10)}
#cover .play{width:140px;height:140px;border-radius:50%;background:rgba(17,17,19,.92);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 30px 70px rgba(0,0,0,.35);transition:transform .25s}
#cover:hover .play{transform:scale(1.06)}
#cover .play svg{width:54px;height:54px;margin-left:6px}
#cover .hint{position:absolute;bottom:7%;font:500 15px 'JB',monospace;color:#333;letter-spacing:.04em;background:rgba(255,255,255,.8);padding:8px 14px;border-radius:99px}
</style>
</head>
<body>
<div id="wrap">
  <div id="frame">
    <div id="stage"></div>
    <div id="cover"><div class="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></div><div class="hint">Play with sound · 60s</div></div>
  </div>
  <div id="ctrl">
    <button id="bPlay" title="Play / pause"></button>
    <span id="tNow">0:00</span>
    <input id="scrub" type="range" min="0" max="60000" value="0">
    <span id="tEnd">1:00</span>
    <button id="bMute" title="Sound"></button>
    <button id="bFull" title="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</div>

 {pad:[50,57,62,65],arp:[62,65,69,74],bass:38},   // Dm
 {pad:[46,53,58,62],arp:[58,62,65,70],bass:34},   // Bb
 {pad:[53,57,60,65],arp:[60,65,69,72],bass:41},   // F
 {pad:[48,55,60,64],arp:[60,64,67,72],bass:36}    // C
];
const PAT=[0,1,2,3,2,1,3,2,0,2,1,3,2,3,1,2];
const secOf=t=>t<3.75?'in':t<11.25?'g1':t<26.25?'g2':t<33.75?'bd':t<48.75?'d2':t<52.5?'rs':t<55.3125?'st':'fin';
const TRT=[15.9,16.4,16.8,17.4,17.8,18.2,18.5,18.9];

function makeAudio(ctx,out,T0,off){
  const sr=ctx.sampleRate,Wt=t=>T0+(t-off),rnd=rng(99);
  const nbuf=ctx.createBuffer(1,sr*3,sr);{const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rnd()*2-1}
  const master=ctx.createGain();master.gain.value=.7;
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=16;comp.ratio.value=3.4;comp.attack.value=.005;comp.release.value=.2;
  master.connect(comp);comp.connect(out);
  master.gain.setValueAtTime(.7,Wt(58.9));master.gain.linearRampToValueAtTime(0,Wt(60));
  const rev=ctx.createConvolver();
  {const L=Math.floor(sr*2.6),b=ctx.createBuffer(2,L,sr);for(let c=0;c<2;c++){const d=b.getChannelData(c);let lp=0;for(let i=0;i<L;i++){const w=rnd()*2-1;lp+=(w-lp)*.4;d[i]=lp*Math.pow(1-i/L,2.8)}}rev.buffer=b}
  const revIn=ctx.createGain(),revOut=ctx.createGain();revOut.gain.value=.6;revIn.connect(rev);rev.connect(revOut);revOut.connect(master);
  const dIn=ctx.createGain(),dly=ctx.createDelay(1.5),fb=ctx.createGain(),dlp=ctx.createBiquadFilter();
  dly.delayTime.value=BEAT*.75;fb.gain.value=.36;dlp.type='lowpass';dlp.frequency.value=3000;
  dIn.connect(dly);dly.connect(dlp);dlp.connect(fb);fb.connect(dly);dlp.connect(master);dlp.connect(revIn);
  const duck=ctx.createGain();duck.connect(master);

  function tone(o){
    const t=Wt(o.t),osc=ctx.createOscillator();osc.type=o.type||'sine';osc.frequency.setValueAtTime(o.f,t);
    if(o.f2)osc.frequency.exponentialRampToValueAtTime(o.f2,t+(o.fd||o.dur));
    if(o.det)osc.detune.value=o.det;
    const e=ctx.createGain(),a=o.a==null?.004:o.a,rel=o.rel==null?.12:o.rel;
    e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(o.g,t+a);e.gain.setValueAtTime(o.g,t+Math.max(a,o.dur));e.gain.exponentialRampToValueAtTime(.0001,t+o.dur+rel);
    let node=osc;
    if(o.lp){const f=ctx.createBiquadFilter();f.type='lowpass';f.Q.value=o.q||.7;f.frequency.setValueAtTime(o.lp,t);if(o.lp2)f.frequency.exponentialRampToValueAtTime(o.lp2,t+o.dur+rel*.5);osc.connect(f);node=f}
    node.connect(e);e.connect(o.dest||master);
    if(o.rv){const s=ctx.createGain();s.gain.value=o.rv;e.connect(s);s.connect(revIn)}
    if(o.dl){const s=ctx.createGain();s.gain.value=o.dl;e.connect(s);s.connect(dIn)}
    osc.start(t);osc.stop(t+o.dur+rel+.05);
  }
  function noise(o){
    const t=Wt(o.t),s=ctx.createBufferSource();s.buffer=nbuf;s.loop=true;
    const f=ctx.createBiquadFilter();f.type=o.type||'bandpass';f.Q.value=o.q||1;f.frequency.setValueAtTime(o.f,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+o.dur+(o.rel||.08)*.5);
    const e=ctx.createGain(),a=o.a==null?.003:o.a,rel=o.rel==null?.08:o.rel;
    e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(o.g,t+a);e.gain.setValueAtTime(o.g,t+Math.max(a,o.dur));e.gain.exponentialRampToValueAtTime(.0001,t+o.dur+rel);
    s.connect(f);f.connect(e);e.connect(o.dest||master);
    if(o.rv){const x=ctx.createGain();x.gain.value=o.rv;e.connect(x);x.connect(revIn)}
    s.start(t,rnd()*1.5);s.stop(t+o.dur+rel+.05);
  }
  const kick=(t,g=.95)=>{g*=.88;
    const T=Wt(t),o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(165,T);o.frequency.exponentialRampToValueAtTime(46,T+.11);
    const e=ctx.createGain();e.gain.setValueAtTime(g,T);e.gain.exponentialRampToValueAtTime(.0001,T+.44);o.connect(e);e.connect(master);o.start(T);o.stop(T+.47);
    noise({t,dur:.01,g:.2,type:'highpass',f:2800,rel:.02});
    duck.gain.setValueAtTime(.3,T);duck.gain.linearRampToValueAtTime(1,T+.25);
  };
  const clap=(t,g=.2)=>{g*=1.6;for(let i=0;i<3;i++)noise({t:t+i*.011,dur:.01,g:g*(i===2?1:.7),type:'bandpass',f:1700,q:.9,rel:i===2?.17:.02,rv:.22})};
  const hat=(t,g,open)=>noise({t,dur:.008,g:g*2.1,type:'highpass',f:7800,q:.5,rel:open?.2:.04});
  const bass=(t,m,len=.2,g=.22)=>{g*=.88;const f=mtof(m);
    tone({type:'sawtooth',f,t,dur:len,g:g*.7,a:.006,rel:.08,lp:560,lp2:190,dest:duck});
    tone({type:'square',f,t,dur:len,g:g*.3,a:.006,rel:.08,lp:340,dest:duck});
    tone({type:'sine',f,t,dur:len,g:g*.9,a:.004,rel:.1,dest:duck})};
  const pad=(t,notes,dur,g=.02,rv=.4)=>notes.forEach(m=>[-9,8].forEach(det=>tone({type:'sawtooth',f:mtof(m),t,dur,g,a:.4,rel:.6,det,lp:1250,lp2:700,rv,dest:duck})));
  const pluck=(t,m,g=.06,len=.15)=>{g*=1.9;const f=mtof(m);
    tone({type:'sawtooth',f,t,dur:len,g,a:.002,rel:.1,lp:4300,lp2:650,q:2,rv:.25,dl:.5});
    tone({type:'square',f,det:7,t,dur:len*.8,g:g*.35,a:.002,rel:.08,lp:2400,lp2:600,rv:.2})};
  const keyp=(t,m,g=.07,len=.5)=>{g*=1.35;const f=mtof(m);
    tone({type:'triangle',f,t,dur:len*.15,g,a:.003,rel:len,rv:.55});
    tone({type:'sine',f:f*2,t,dur:len*.08,g:g*.3,a:.002,rel:len*.5,rv:.4})};
  const ping=(t,m,g=.09,len=.35,dl=.25)=>{g*=1.5;const f=mtof(m);
    tone({type:'sine',f,t,dur:.006,g,a:.002,rel:len,rv:.55,dl});
    tone({type:'sine',f:f*2.005,t,dur:.004,g:g*.25,a:.002,rel:len*.5,rv:.4})};
  const tick=(t,g=.05,f=2400)=>noise({t,dur:.005,g:g*1.6,type:'bandpass',f,q:3,rel:.03,rv:.15});
  const thock=(t,g=.2)=>{tone({type:'sine',f:190,f2:90,fd:.07,t,dur:.04,g,rel:.12});noise({t,dur:.008,g:g*.5,type:'bandpass',f:1300,q:1.4,rel:.05})};
  const impact=(t,g=.85)=>{g*=.8;tone({type:'sine',f:70,f2:30,fd:1.2,t,dur:.35,g,rel:1.7});noise({t,dur:.04,g:.32,type:'lowpass',f:3200,rel:1.5,rv:.8});noise({t,dur:.02,g:.22,type:'highpass',f:6500,rel:1.1,rv:.5})};
  const riser=(t,d,g,f1,f2)=>noise({t,dur:d*.04,g,type:'bandpass',f:f1,f2,q:.9,a:d*.96,rel:.12,rv:.3});

  /* ---- scripted one-offs ---- */
  const ev=[];const E=(t,fn)=>ev.push([t,fn]);
  E(0.3,()=>pluck(.3,74,.025,.3));
  E(2.65,()=>riser(2.65,1.1,.14,1200,9000));
  E(3.75,()=>{impact(3.75,.8);noise({t:3.75,dur:.05,g:.14,type:'highpass',f:5500,rel:.9,rv:.5})});
  [[4.25,.07],[4.45,.06],[5.0,.09]].forEach(([t,g])=>E(t,()=>thock(t,g)));
  for(let x=5.6;x<6.7;x+=.075)E(x,()=>tick(x,.05,1800+((x*1000)%7)*140));
  E(6.78,()=>{ping(6.78,81,.08);ping(6.93,86,.06)});
  E(7.78,()=>{ping(7.78,74,.06);ping(7.9,81,.06)});
  E(10.0,()=>{noise({t:10.0,dur:.9,g:.16,type:'bandpass',f:260,f2:3000,q:1.1,a:1.5,rel:1.6,rv:.5});tone({type:'sine',f:70,f2:190,fd:3,t:10.2,dur:2.6,g:.11,a:1.9,rel:.9})});
  E(14.85,()=>tone({type:'sine',f:62,f2:40,fd:.5,t:14.85,dur:.2,g:.35,rel:.9}));
  const sc=[74,77,81,84,86,89,91,93];
  TRT.forEach((te,i)=>{E(te,()=>{ping(te,sc[i],.085,.5);tick(te-.9,.03,3200)})});
  E(19.3,()=>{tone({type:'sine',f:233,t:19.3,dur:1.0,g:.045,a:.3,rel:1.2,rv:.5});tone({type:'sine',f:247,t:19.3,dur:1.0,g:.04,a:.3,rel:1.2,rv:.5})});
  E(22.6,()=>noise({t:22.6,dur:.3,g:.08,type:'bandpass',f:500,f2:4000,q:1,a:.25,rel:.4,rv:.4}));
  E(23.65,()=>thock(23.65,.12));
  for(let i=0;i<9;i++)E(24.05+i*.09,()=>ping(24.05+i*.09,74+i*2,.035,.18,.1));
  E(24.2,()=>thock(24.2,.07));
  for(let i=0;i<24;i++){const t=26.95+i*.085;E(t,()=>tick(t,.03+.012*(i%3),1200+(i*137)%1800))}
  E(29.6,()=>{tone({type:'sine',f:73.4,t:29.6,dur:2.0,g:.12,a:.4,rel:1,rv:.3});tone({type:'sine',f:77.8,t:29.6,dur:2.0,g:.09,a:.4,rel:1,rv:.3})});
  E(30.0,()=>{riser(30.0,3.7,.2,350,9500);tone({type:'sawtooth',f:200,f2:1900,fd:3.7,t:30.0,dur:3.6,g:.025,a:3.4,rel:.1,lp:3500,rv:.3})});
  for(let i=0;i<12;i++){const t=31.2+i*.075;E(t,()=>tick(t,.035,3000-i*140))}
  E(32.8,()=>{ping(32.8,98,.07,.8);ping(32.8,86,.05,.8)});
  E(33.75,()=>{impact(33.75,.95);noise({t:33.75,dur:.06,g:.16,type:'highpass',f:5000,rel:1.0,rv:.5})});
  E(34.1,()=>thock(34.1,.14));
  for(let i=0;i<4;i++){const t=35.25+i*.55;E(t,()=>tick(t,.03,2200))}
  E(36.0,()=>{ping(36.0,81,.09);ping(36.12,88,.07)});
  E(37.0,()=>keyp(37.0,72,.07,.4));
  E(37.9,()=>{ping(37.9,84,.09);ping(38.02,91,.07)});
  E(38.8,()=>{[62,69,74,77,81].forEach((m,i)=>keyp(38.8+i*.04,m,.06,1.4));riser(38.0,.8,.06,800,6000)});
  E(39.4,()=>{ping(39.4,93,.07,1.0);ping(39.55,98,.05,1.0)});
  KEYS.forEach(([n,ic,ds,tk],i)=>E(tk,()=>{thock(tk,.18);ping(tk,[74,77,81,84][i],.09,.7);ping(tk+.05,[86,89,93,96][i],.035,.5)}));
  E(45.2,()=>{ping(45.2,86,.08,.6);ping(45.32,93,.07,.8);thock(45.2,.08)});
  E(46.4,()=>{thock(46.4,.14);ping(46.45,81,.07,.5)});
  E(47.6,()=>{ping(47.6,88,.08,.6);ping(47.72,95,.06,.8);thock(47.6,.1)});
  E(50.15,()=>{thock(50.15,.18);tick(50.15,.08,3400);ping(50.2,98,.08,.9)});
  E(50.65,()=>{ping(50.65,91,.07,.6);ping(50.75,96,.05,.6)});
  E(52.5,()=>[50,57,62,65,69].forEach((m,i)=>keyp(52.5+i*.03,m,.07,1.8)));
  E(53.62,()=>[46,53,58,62,65].forEach((m,i)=>keyp(53.62+i*.03,m,.065,1.5)));
  E(54.4,()=>riser(54.4,.92,.16,600,9500));
  E(55.3125,()=>{impact(55.3125,1.0);kick(55.3125,.9);
    pad(55.3125,[38,50,57,62,65,69],4.6,.028,.6);
    [62,69,74,77,81,86].forEach((m,i)=>keyp(55.3125+i*.045,m,.07,2.4));
    noise({t:55.3125,dur:.05,g:.18,type:'highpass',f:5200,rel:1.6,rv:.7})});
  E(55.55,()=>ping(55.55,93,.07,1.0));
  E(57.0,()=>noise({t:57.0,dur:.5,g:.05,type:'bandpass',f:1500,f2:6500,q:1,a:.2,rel:.25,rv:.3}));
  E(57.6,()=>{tick(57.6,.05,2600);tick(57.72,.04,3000)});
  E(58.72,()=>{thock(58.72,.16);tick(58.72,.07,3400);ping(58.8,98,.06,.9)});

  function schedule(a,b){
    const S=BEAT/4;
    for(let k=Math.ceil(a/S-1e-9);k*S<b-1e-9;k++){
      const t=k*S;if(t>=DUR)break;if(t<off-1e-6)continue;
      const bar=Math.floor(t/BAR+1e-9),step=k-bar*16,sec=secOf(t),ch=CH[bar%4];
      if(['g1','g2','d2','rs'].includes(sec)&&step%4===0)kick(t,sec==='rs'?.8:.95);
      if(['g2','d2'].includes(sec)&&(step===4||step===12))clap(t,sec==='d2'?.22:.17);
      if(sec==='g1'&&step%4===2)hat(t,.032,false);
      if(sec==='g2'&&step%2===0)hat(t,step%4===2?.04:.026,false);
      if(sec==='d2'){if(step%2===0)hat(t,step%4===2?.045:.03,false);else hat(t,.013,false);if(step===6||step===14)hat(t,.04,true)}
      if(sec==='rs'&&step%4===2)hat(t,.025,false);
      if(['g1','g2','d2','rs'].includes(sec)&&step%4===2){let m=ch.bass;if(sec==='d2'&&step===14&&bar%2)m+=12;bass(t,m,.19,sec==='rs'?.17:.23)}
      const nt=ch.arp[PAT[step]];
      if(sec==='in'&&bar===1&&step%2===0)pluck(t,nt,.03,.14);
      if(sec==='g1'&&step%2===0)pluck(t,nt,.045,.15);
      if((sec==='g2'||sec==='d2'))pluck(t,nt,step%4===0?.07:.055,.14);
      if(sec==='bd'&&step%2===0)keyp(t,nt+12,.05,.45);
      if(sec==='rs'&&step%4===0)keyp(t,nt+12,.04,.4);
      if(sec==='bd'&&t>=31.875){const v=(t-31.875)/1.875;noise({t,dur:.05,g:.03+.13*v,type:'bandpass',f:2100,q:.8,rel:.08,rv:.2});if(step%4===0)tone({type:'sine',f:190,f2:110,fd:.05,t,dur:.03,g:.1*v,rel:.1})}
    }
    for(let bar=Math.floor(a/BAR);bar*BAR<b;bar++){
      const t=bar*BAR;if(t<a-1e-9||t>=b||t<off-1e-6||t>=55.3125)continue;
      const sec=secOf(t),ch=CH[bar%4];
      const g={in:.9,g1:.65,g2:.65,bd:1.15,d2:.7,rs:.55,st:.9}[sec]||.6;
      pad(t,ch.pad,BAR+.15,.02*g);
    }
    ev.forEach(([t,fn])=>{if(t>=a-1e-9&&t<b-1e-9&&t>=off-1e-6)fn()});
  }
  return{schedule,master};
}

/* ================= PLAYER ================= */
let curT=RENDER?0:5.9,playing=false,muted=false,actx=null,eng=null,pumpTimer=null,scale=1;
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function fit(){
  if(RENDER){scale=1;stage.style.transform='none';Q=1}
  else{
    const aw=window.innerWidth-32,ah=window.innerHeight-86;
    scale=Math.max(.2,Math.min(aw/W,ah/H));
    const fr=$('#frame');fr.style.width=W*scale+'px';fr.style.height=H*scale+'px';
    stage.style.transform='scale('+scale+')';
    Q=Math.min(2,Math.max(1,(window.devicePixelRatio||1)*scale));
  }
  sizeCanvases();render(curT);
}
function pump(){
  if(!eng)return;
  const tNow=eng.off+(actx.currentTime-eng.T0),upto=Math.min(DUR+1,tNow+3.2);
  if(upto>eng.sched){eng.A.schedule(eng.sched,upto);eng.sched=upto}
}
function startAudio(off){
  stopAudio();
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  if(!actx)actx=new AC();
  if(actx.state==='suspended')actx.resume();
  const out=actx.createGain();out.gain.value=muted?0:1;out.connect(actx.destination);
  const T0=actx.currentTime+.14;
  eng={A:makeAudio(actx,out,T0,off),out,T0,off,sched:off};
  pump();pumpTimer=setInterval(pump,200);
}
function stopAudio(){
  clearInterval(pumpTimer);
  if(eng){const o=eng.out;try{o.gain.cancelScheduledValues(0);o.gain.setTargetAtTime(0,actx.currentTime,.015)}catch(e){}setTimeout(()=>{try{o.disconnect()}catch(e){}},200);eng=null}
}
function play(){
  if(curT>=DUR-.05)curT=0;
  playing=true;$('#cover').style.display='none';startAudio(curT);ui();
}
function pause(){playing=false;stopAudio();ui()}
function seek(t){curT=clamp(t,0,DUR);render(curT);if(playing)startAudio(curT);ui()}
function ui(){
  $('#bPlay').innerHTML=playing?IC.pause:IC.play;
  $('#bMute').innerHTML=muted?IC.mute:IC.snd;
  $('#tNow').textContent=fmt(curT);
  if(document.activeElement!==$('#scrub'))$('#scrub').value=Math.round(curT*1000);
}
function loop(){
  if(playing&&eng){curT=Math.max(eng.off,eng.off+(actx.currentTime-eng.T0));if(curT>=DUR){curT=DUR;pause();$('#cover').style.display='flex'}}
  render(curT);
  if(playing||true)$('#tNow').textContent=fmt(curT);
  if(playing&&document.activeElement!==$('#scrub'))$('#scrub').value=Math.round(curT*1000);
  requestAnimationFrame(loop);
}

/* --- render-mode hooks (used by the MP4 exporter) --- */
window.__seek=t=>{curT=t;render(t);return true};
window.__audioWav=async()=>{
  const sr=44100,N=Math.round(DUR*sr),oc=new OfflineAudioContext(2,N,sr),out=oc.createGain();out.connect(oc.destination);
  const A=makeAudio(oc,out,0,0);A.schedule(0,DUR+.5);
  const buf=await oc.startRendering(),L=buf.getChannelData(0),R=buf.getChannelData(1);
  const bytes=new Uint8Array(44+N*4),dv=new DataView(bytes.buffer);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i))};
  ws(0,'RIFF');dv.setUint32(4,36+N*4,true);ws(8,'WAVE');ws(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,2,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr*4,true);dv.setUint16(32,4,true);dv.setUint16(34,16,true);ws(36,'data');dv.setUint32(40,N*4,true);
  let p=44;for(let i=0;i<N;i++){const a=clamp(L[i],-1,1),b=clamp(R[i],-1,1);dv.setInt16(p,a<0?a*32768:a*32767,true);dv.setInt16(p+2,b<0?b*32768:b*32767,true);p+=4}
  let s='';const CH=0x8000;for(let i=0;i<bytes.length;i+=CH)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(s);
};

if(!RENDER){
  $('#cover').addEventListener('click',play);
  $('#bPlay').addEventListener('click',()=>playing?pause():play());
  $('#bMute').addEventListener('click',()=>{muted=!muted;if(eng)eng.out.gain.setTargetAtTime(muted?0:1,actx.currentTime,.03);ui()});
  $('#bFull').addEventListener('click',()=>{const d=document.documentElement;document.fullscreenElement?document.exitFullscreen():d.requestFullscreen&&d.requestFullscreen()});
  $('#scrub').addEventListener('input',e=>{$('#cover').style.display='none';seek(e.target.value/1000)});
  addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playing?pause():play()}if(e.code==='ArrowLeft')seek(curT-3.75);if(e.code==='ArrowRight')seek(curT+3.75)});
  addEventListener('resize',fit);
}
(async()=>{
  try{await Promise.all([document.fonts.load('600 100px Outfit'),document.fonts.load('700 100px Outfit'),document.fonts.load('400 30px Outfit'),document.fonts.load('500 30px Outfit'),document.fonts.load('500 30px JB'),document.fonts.load('600 30px JB')]);await document.fonts.ready}catch(e){}
  const im=new Image();im.src=LOGO;try{await im.decode()}catch(e){}
  fit();ui();window.__ready=true;
  if(!RENDER)requestAnimationFrame(loop);
})();

})();
